                },

                    MONTH: "/esm/v3/media-company/year/month/day/requestor-id/platform/nsdk?metrics=authn-attempts,authn-successful,authz-attempts,authz-failed,authz-rejected,authz-successful",
                    DAY: "/esm/v3/media-company/year/month/day/requestor-id/platform/nsdk?metrics=authn-attempts,authn-successful,authz-attempts,authz-failed,authz-rejected,authz-successful"
                }

            const app = document.getElementById('app');
            const uploadBox = document.getElementById('upload-box');
            const ddPremiums = document.getElementById('ddPremiumCustApps');
            const ddTime = document.getElementById('ddTimeZooms');
            const spinnerElement = document.getElementById('spinner');
            const resultsDiv = document.getElementById('results');
            const statusMessage = document.getElementById('statusMessage');
            const dashboard = document.getElementById('dashboard');

            console.log("......... BRING BACK THE REQUESTOR-ID PICKER BOX ONCE FRED IS FINDING RELEVANT ESM DATA");
            let _FLTR_ESM = ''; // tack on ESM filter
            let requestorConfigCache = {}; // call config once per requestor-id

            function init() {
                populateSelectList('ddPremiumCustApps');

                if (localStorage.length > 0) {
                    uploadBox.style.display = 'none';
                    ddPremiums.style.display = 'block';
                    ddTime.style.display = 'block';
                }
            }
            // setup label copy url handlers
            // All data tables should have a clickable header to copy the source ESMURL for data sanity checks
            function _setupLabels() {
                document.querySelectorAll('.copy-url').forEach(element => {
                    element.addEventListener('click', () => {
                        const urlId = element.getAttribute('data-url'); // Get the ID from data-url
                        console.log("GET :: " + urlId);
                        const urlElement = document.getElementById(urlId); // Find the hidden input
                        if (urlElement && urlElement.value) {
                            const url = urlElement.value; // Get the URL value
                            copyToClipboard(url); // Copy the URL to the clipboard
                        } else {
                            console.error(`No URL found for ID: ${urlId}`);
                        }
                    });
                });
            }

            function calculateTimeRange(time) {
                const now = new Date();
                let start;

                switch (time) {
                    case "YEAR":
                        start = new Date(now.getFullYear(), 0, 1);
                        break;
                    case "MONTH":
                        start = new Date(now.getFullYear(), now.getMonth(), 1);
                        break;
                    case "DAY":
                        start = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                        break;
                    case "HOUR":
                        start = new Date(now.getTime() - 1 * 60 * 60 * 1000);
                        break;
                    case "MINUTE":
                        start = new Date(now.getTime() - 60 * 60 * 1000);
                        break;
                    default:
                        throw new Error("Invalid time range");
                }

                const formatLocalTime = (date) => {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, "0");
                    const day = String(date.getDate()).padStart(2, "0");
                    const hours = String(date.getHours()).padStart(2, "0");
                    const minutes = String(date.getMinutes()).padStart(2, "0");
                    return `${year}-${month}-${day}T${hours}:${minutes}`;
                };

                return {
                    start: formatLocalTime(start),
                    end: formatLocalTime(now),
                };
            }

            const handleFile = async (file) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const rows = parseCSV(text);
                    if (rows.length > 0) {
                        spinnerElement.style.display = 'flex';
                        await processCSVRows(rows);
                        spinnerElement.style.display = 'none';
                        populateSelectList('ddPremiumCustApps');
                        uploadBox.style.display = 'none';
                        ddPremiums.style.display = 'block';
                        ddTime.style.display = 'block';
                    }
                };
                reader.readAsText(file);
            };

            const parseCSV = (text) => {
                const lines = text.split('\n');
                const headers = lines[0].split(',');
                return lines.slice(1).filter(line => line.trim()).map(line => {
                    const values = line.split(',');
                    return {
                        mediaCompany: values[0].trim(),
                        env: values[1].trim(),
                        key: values[2].trim()
                    };
                });
            };

            const processCSVRows = async (rows) => {
                for (const row of rows) {
                    if (row.mediaCompany.length <= 1 || row.env.length <= 1 || row.key.length <= 1) {
                        continue;
                    }

                    const softwareStatement = row.key;
                    const environment = row.env;
                    const host = environment === 'staging'
                        ? 'https://sp.auth-staging.adobe.com'
                        : 'https://sp.auth.adobe.com';

                    try {
                        const response = await fetch(`${host}/o/client/register`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ software_statement: softwareStatement })
                        });

                        const data = await response.json();
                        const clientId = data.client_id;
                        const clientSecret = data.client_secret;

                        const c_name = `${row.mediaCompany}_${row.env}`;
                        const c_val = `${clientId}:${clientSecret}`;
                        setLocalStorage(c_name, c_val);
                        console.log(`NOW WELCOMING!!! ${c_name} = ${c_val}`);
                    } catch (error) {
                        console.error(`Error processing row: ${row.mediaCompany}`, error);
                    }
                }
            };

            function setLocalStorage(key, value) {
                const skey = key.split(' ').join('');
                const svalue = value.split(' ').join('');
                localStorage.setItem(skey, svalue);
            }

            function populateSelectList(selectElementId) {
                const selectElement = document.getElementById(selectElementId);
                selectElement.innerHTML = '';

                const defaultOption = document.createElement('option');
                defaultOption.text = 'Select Media-Co';
                defaultOption.value = '';
                selectElement.add(defaultOption);

                const options = [];

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);

                    const option = document.createElement('option');
                    option.value = value;
                    option.text = key;
                    options.push(option);
                }

                options.sort((a, b) => a.text.localeCompare(b.text));
                options.forEach(option => selectElement.add(option));
            }

            async function changeMediaCompany(e) {
                const selectedValue = e.target.value;

                if (!selectedValue) {
                    clearDashboard();
                    return;
                }

                // Clear results-pod when changing media company
                const resultsPod = document.getElementById('results-pod');
                resultsPod.innerHTML = '';

                const aMediaCoEnv = e.target.options[e.target.selectedIndex].text.split('_');
                const aClient = selectedValue.split(':');

                const mediaCo = aMediaCoEnv[0];
                const environment = aMediaCoEnv[1];
                const clientId = aClient[0];
                const clientSecret = aClient[1];
                let accessToken = aClient[2];
                let expirationDateEpoch = aClient[3];

                requestorConfigCache = {};
                console.log("CONFIG CACHE CLEARED......... NEW MEDIA-CO : " + mediaCo);

                let host;
                if (!accessToken && !expirationDateEpoch) {
                    console.log("MUST GET ACCESS TOKEN");
                    host = environment === 'staging'
                        ? 'https://sp.auth-staging.adobe.com'
                        : 'https://sp.auth.adobe.com';

            async function BuildDashboard(time, token, environment) {
                const host = environment === 'staging'
                    ? 'https://mgmt.auth-staging.adobe.com'
                    : 'https://mgmt.auth.adobe.com';

                const { start, end } = calculateTimeRange(time);

                console.log("ESM TIME EXPERIMENTAL :: start = " + start + " END NOT SET [" + time + "]");
                const appendTimeParams = (url) => {
                    const urlObj = new URL(url, host);
                    urlObj.searchParams.set('start', start);
                    return urlObj.toString();
                };

                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.MEDIA_COMPANY[time] + _FLTR_ESM), token, 'month,day,year,requestor-id,media-tokens,authn-attempts,authn-successful,authz-attempts,authz-failed,authz-rejected,authz-successful','MEDIA COMPANY');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.FRAUD[time] + _FLTR_ESM), token, '', 'FRAUD');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.EVENTS[time] + _FLTR_ESM), token, '', 'EVENTS');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.MVPDS[time] + _FLTR_ESM), token, '', 'MVPDS');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.PLATFORM_STATS[time] + _FLTR_ESM), token, '', 'PLATFORM');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.DEVICE[time] + _FLTR_ESM), token, '', 'DEVICE');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.OS[time] + _FLTR_ESM), token, '', 'OS');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.BROWSER[time] + _FLTR_ESM), token, '', 'BROWSER');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.SDK[time] + _FLTR_ESM), token, '', 'SDK');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.CHANNEL[time] + _FLTR_ESM), token, '', 'CHANNEL');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.CONTENT_CATEGORY[time] + _FLTR_ESM), token, '', 'CONTENT CTG');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.EAP[time] + _FLTR_ESM), token, '', 'EXT.AUTH.PROVIDER');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.SSO[time] + _FLTR_ESM), token, '', 'SINGLE-SIGN-ON');
                _esmToTable(appendTimeParams(DASHBOARD_POD_TIME_ESMURLS.DC_STATS[time] + _FLTR_ESM), token, '', 'DATA CENTER');

                dashboard.style.display = 'flex';
            }

            async function _esmToTable(url, token, esmCols = '', labelName = '') {
                const resultsPod = document.getElementById('results-pod');

                // Create table container
                const tableContainer = document.createElement('div');
                tableContainer.className = 'table-container';
                resultsPod.appendChild(tableContainer);

                // Generate a unique ID for this table
                const resultTbl = 'tbl-' + Math.random().toString(36).substr(2, 9);

                // Determine the table title - use labelName if provided, otherwise extract from URL
                const tblTitle = labelName || (() => {
                    const urlParts = new URL(url).pathname.split('/').filter(part => part);
                    return urlParts[urlParts.length - 1] || 'data';
                })();

                // Create the header with copy functionality
                const headerSpan = document.createElement('span');
                headerSpan.className = 'copy-url';
                headerSpan.setAttribute('data-url', `${resultTbl}-url`);

                // Add click handler for copying URL
                headerSpan.addEventListener('click', () => {
                    const urlId = headerSpan.getAttribute('data-url');
                    const urlElement = document.getElementById(urlId);
                    if (urlElement && urlElement.value) {
                        copyToClipboard(urlElement.value);
                    }
                });

                // Create the title
                const title = document.createElement('h4');
                title.textContent = tblTitle;
                headerSpan.appendChild(title);

                // Create hidden input with the URL
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.id = `${resultTbl}-url`;
                hiddenInput.value = url;
                headerSpan.appendChild(hiddenInput);

                tableContainer.appendChild(headerSpan);

                const progress = document.createElement('div');
                progress.textContent = 'Loading data...';
                tableContainer.appendChild(progress);

                try {
                    const response = await fetchWithProgress(url, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    }, progressElement);

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const jsonResponse = await response.json();
                    const report = jsonResponse.report;

                    tableContainer.removeChild(progress);

                    if (!report || report.length === 0) {
                        tableContainer.innerHTML = '<p>No data available</p>';
                        return;
                    }

                    // Extract unique requestor-ids for filtering
                    const uniqueRequestorIds = new Set();
                    report.forEach(item => {
                        if (item['requestor-id']) {
                            uniqueRequestorIds.add(item['requestor-id']);
                        }
                    });

                    // Show fltReqBox only if there are 2 or more unique requestor-ids
                    // OR if _FLTR_ESM contains requestor-ids to be un-selected
                    if ((uniqueRequestorIds.size >= 2) || (_FLTR_ESM.includes("&requestor-id="))) {
                        document.getElementById('fltReqBox').style.display = 'block';

                        // Populate the fieldset with checkboxes for each unique requestor-id
                        const fsRequestorIds = document.getElementById('fsRequestorIds');
                        fsRequestorIds.innerHTML = '<legend>REQUESTOR-ID</legend>';
                        uniqueRequestorIds.forEach(requestorId => {
                            const span = document.createElement('span');
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.id = `reqId${requestorId}`;
                            checkbox.name = 'requestor-ids';
                            checkbox.value = requestorId;
                            checkbox.checked = true;
                            span.appendChild(checkbox);
                            const label = document.createElement('label');
                            label.htmlFor = `reqId${requestorId}`;
                            label.textContent = requestorId;
                            span.appendChild(label);
                            fsRequestorIds.appendChild(span);
                        });

                        // Add the "GO FISH" link after the checkboxes
                        const applyFilterLink = document.createElement('a');
                        applyFilterLink.id = 'applyFilterLink';
                        applyFilterLink.href = '#';
                        applyFilterLink.title = 'Click to filter by requestor-id(s). Uncheck all to reset full requestor-id list';
                        applyFilterLink.textContent = 'GO FISH';
                        fsRequestorIds.appendChild(applyFilterLink);

                        // Add event listener to the apply/remove filter link
                        applyFilterLink.onclick = async function (event) {
                            event.preventDefault();

                            // Clear the dashboard before applying new filters
                            const resultsPod = document.getElementById('results-pod');
                            resultsPod.innerHTML = '';
                            progressElement(true);

                            try {
                                // Get all checked checkboxes
                                const checkboxes = document.querySelectorAll('#fsRequestorIds input[type="checkbox"]:checked');

                                // Clear the global filter variable
                                _FLTR_ESM = '';

                                if (checkboxes.length > 0) {
                                    // Build the _FLTR_ESM string based on checked checkboxes
                                    _FLTR_ESM = '&' + Array.from(checkboxes)
                                        .map(checkbox => `requestor-id=${checkbox.value}`)
                                        .join('&');
                                }

                                console.log("FILTER: " + _FLTR_ESM);

                                const aMediaCoEnv = ddPremiums.options[ddPremiums.selectedIndex].text.split('_');
                                const aClient = ddPremiums.value.split(':');
                                const environment = aMediaCoEnv[1];
                                const accessToken = aClient[2];

                                // Rebuild the dashboard with new filters
                                await BuildDashboard(ddTime.value, accessToken, environment);
                            } catch (error) {
                                console.error('Error applying filters:', error);
                                statusMessage.textContent = "Error applying filters. Please try again.";
                            } finally {
                                progressElement(false);
                            }
                        };
                    } else {
                        // Hide fltReqBox if there is only one or no requestor-id
                        document.getElementById('fltReqBox').style.display = 'none';
                    }

                    // Create scrollable container for just the table
                    const scrollContainer = document.createElement('div');
                    scrollContainer.className = 'scroll';
                    tableContainer.appendChild(scrollContainer);

                    const table = document.createElement('table');
                    table.className = 'data-table';
                    table.id = resultTbl; // Set the dynamic ID
                    table.style.width = 'auto';

                    const columns = esmCols.split(',').filter(col => col.trim() !== '');
                    const availableColumns = columns.length > 0 ?
                        columns.filter(col => report[0].hasOwnProperty(col)) :
                        Object.keys(report[0]);

                    const thead = document.createElement('thead');
                    const headerRow = document.createElement('tr');

                    availableColumns.forEach(col => {
                        const th = document.createElement('th');
                        th.textContent = col.toUpperCase().replace(/-/g, ' ');
                        headerRow.appendChild(th);
                    });

                    thead.appendChild(headerRow);
                    table.appendChild(thead);

                    const tbody = document.createElement('tbody');

                    report.forEach(item => {
                        const row = document.createElement('tr');

                        availableColumns.forEach(col => {
                            const td = document.createElement('td');

                            let value = item[col];
                            if (value === undefined || value === null) {
                                value = '';
                            } else if (typeof value === 'object') {
                                value = JSON.stringify(value);
                            } else if (col.toLowerCase().includes('time') ||
                                col.toLowerCase().includes('date')) {
                                value = new Date(value).toLocaleString();
                            } else if (typeof value === 'number') {
                                value = value.toLocaleString();
                            }

                            td.textContent = value;
                            row.appendChild(td);
                        });

                        tbody.appendChild(row);
                    });

                    table.appendChild(tbody);
                    scrollContainer.appendChild(table); // Add table to scroll container

                } catch (error) {
                    console.error('Error fetching or parsing JSON:', error);
                    tableContainer.innerHTML = `<p class="error">Error loading data: ${error.message}</p>`;
                } finally {
                    progressElement(false);
                }
            }

            // Add this helper function if not already present
            function copyToClipboard(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                // Optional: Show a brief notification that text was copied
                const notification = document.createElement('div');
                notification.textContent = 'URL copied to clipboard!';
                notification.style.position = 'fixed';
                notification.style.bottom = '20px';
                notification.style.right = '20px';
                notification.style.backgroundColor = '#333';
                notification.style.color = '#fff';
                notification.style.padding = '10px';
                notification.style.borderRadius = '4px';
                notification.style.zIndex = '1000';
                document.body.appendChild(notification);

                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            }

            function progressElement(show) {
                const spinner = document.getElementById('spinner');
                if (show) {
                    spinner.style.display = 'block';
                } else {
                    spinner.style.display = 'none';
                }
            }

            async function fetchWithProgress(url, options, progressCallback) {
                progressCallback(true);

                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.error('Fetch error:', error);
                    throw error;
                } finally {
                    progressCallback(false);
                }
            }

            uploadBox.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.csv';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file && file.type === 'text/csv') {
                        handleFile(file);
                    } else {
                        alert('Please upload a valid CSV file.');
                    }
                };
                input.click();
            });

            init();
        </script>
