// Master reusable function to handle both registration and ESM data fetching
async function dasink(isNewRegistration = false) {
    const progressElement = document.getElementById('load_progress');
    const bodyElement = document.body;

    try {
        // Set the mouse cursor to "loading" and initialize progress
        bodyElement.style.cursor = 'wait'; // Set cursor to "loading"
        progressElement.value = 1; // Initialize progress bar to 1%
        progressElement.style.display = 'block'; // Ensure progress bar is visible

        let clientId, clientSecret;

        if (isNewRegistration) {
            // Step 1 -> Check most important field for new registration
            const softwareStatement = fldSS.value;
            if (softwareStatement.length <= 1) {
                highlightRequiredFields();
                bonk("No Software Statement, no ESM data. Please paste a Software Statement if you can't pick one.");
                return;
            }

            // Step 2: Submit the form and process the data for new registration
            const environment = fldEnviro.value;
            const host = environment === 'staging' 
                ? 'https://sp.auth-staging.adobe.com' 
                : 'https://sp.auth.adobe.com';

            // First AJAX POST request for new registration
            const response1 = await fetchWithProgress(`${host}/o/client/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ software_statement: softwareStatement })
            }, progressElement);

            const data1 = await response1.json();
            clientId = data1.client_id;
            clientSecret = data1.client_secret;

            // Set fields (this needs to be saved)
            fldClientId.value = clientId;
            fldClientSecret.value = clientSecret;
        } else {
            // Use existing client ID and secret
            clientId = fldClientId.value;
            clientSecret = fldClientSecret.value;

            if (!clientId || !clientSecret) {
                highlightRequiredFields();
                bonk("First, register a new Software Statement or pick an existing Media-Company.");
                return;
            }
        }

        // Common steps for both new registration and existing client
        const environment = fldEnviro.value;
        const host = environment === 'staging' 
            ? 'https://sp.auth-staging.adobe.com' 
            : 'https://sp.auth.adobe.com';
        const esmDomain = environment === 'staging'
            ? 'https://mgmt.auth-staging.adobe.com'
            : 'https://mgmt.auth.adobe.com';

        // Second AJAX POST request to get access token
        const response2 = await fetchWithProgress(`${host}/o/client/token?`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `grant_type=client_credentials&client_id=${clientId}&client_secret=${clientSecret}`
        }, progressElement);

        if (!response2.ok) {
            const errorText = await response2.text();
            throw new Error(`Failed to fetch access token: ${errorText}`);
        }

        const data2 = await response2.json();
        const accessToken = data2.access_token; // Access token for API requests

        // COUNT SAFETY CHECK
        let esmUrl = checkForCountCall(fldEsmUrl.value);

        // Fetch ESM data
        const response3 = await fetchWithProgress(`${esmDomain + esmUrl}`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${accessToken}` }
        }, progressElement);

        if (!response3.ok) {
            const errorText = await response3.text();
            if (errorText.startsWith("The requested metrics are not available for the selected dimensions")) {
                // Sanitize the URL by removing the query string
                const sanitizedEsmUrl = esmUrl.replace(/&?metrics=[^&]*/, '');

                // Rerun the fetch call with the sanitized URL
                const response4 = await fetchWithProgress(`${esmDomain + sanitizedEsmUrl}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                }, progressElement);

                if (!response4.ok) {
                    const errorText2 = await response4.text();
                    throw new Error(`Failed to fetch ESM data: ${errorText2}`);
                }

                const data4 = await response4.json();

                // Prepare the alert message
                const alertMessage = `Hey, your original call didn't work because of a METRICS mis-match.\n\n` +
                                    `Here was the original query:\n${esmUrl}\n\n` +
                                    `Here is what was run and is being displayed:\n${sanitizedEsmUrl}`;

                // Show the alert to the user
                alert(alertMessage);

                // Duplicate the message in the console using the ack function
                ack(alertMessage);

                // Render the resulting data
                renderData(data4, clientId, clientSecret, isNewRegistration, saveClient, environment);
                return; // Exit the function after handling the error
            }
            throw new Error(`Failed to fetch ESM data: ${errorText}`);
        }

        const data3 = await response3.json(); // Parse JSON response

        // Render the resulting data
        renderData(data3, clientId, clientSecret, isNewRegistration, saveClient, environment);
    } catch (error) {
        bonk(`[0x33] Error: ${error.message}`);
    } finally {
        // Ensure progress bar is reset and cursor is restored
        progressElement.value = 100; // Set progress to 100%
        setTimeout(() => {
            progressElement.style.display = 'none'; // Hide progress bar
            bodyElement.style.cursor = 'default'; // Restore cursor to default
        }, 500); // Delay to ensure user sees completion
    }
}

// Updated fetchWithProgress function to handle progress updates
async function fetchWithProgress(url, options = {}, progressElement) {
    const response = await fetch(url, options);

    // Check if the response has a content-length header
    const contentLength = response.headers.get('content-length');
    let totalBytes = contentLength ? parseInt(contentLength, 10) : null;
    let loadedBytes = 0;

    // Create a new response with progress tracking
    const reader = response.body.getReader();
    const stream = new ReadableStream({
        async start(controller) {
            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    progressElement.value = 100; // Ensure progress reaches 100% at the end
                    controller.close();
                    break;
                }
                loadedBytes += value.length;

                // Update progress
                if (totalBytes) {
                    const percentComplete = (loadedBytes / totalBytes) * 100;
                    progressElement.value = percentComplete;
                } else {
                    // Simulate progress if content-length is missing
                    progressElement.value = Math.min(progressElement.value + 10, 100); // Increment by 10%
                }

                controller.enqueue(value);
            }
        },
    });

    // Return the new response
    return new Response(stream, {
        headers: response.headers,
        status: response.status,
        statusText: response.statusText,
    });
}


// Function to set a value in localStorage
function setLocalStorage(key, value) 
{
    // safety trimming
    var skey = key.split(' ').join('');
    var svalue = value.split(' ').join('');
    localStorage.setItem(skey, svalue);
}

// Function to get a value from localStorage
function getLocalStorage(key) {
  return localStorage.getItem(key);
}

// Function to populate select list from localStorage
// Function to populate select list from localStorage with alphabetized options
function populateSelectList(selectElementId, entryType) {
    const selectElement = document.getElementById(selectElementId);

    // Clear existing options
    selectElement.innerHTML = '';

    // Add a default "Select" option
    const defaultOption = document.createElement('option');
    defaultOption.text = ''; // Empty text for default option
    defaultOption.value = '';
    selectElement.add(defaultOption);

    // Collect all options in an array for sorting
    const options = [];

    // Iterate over all items in localStorage
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);

        // Create an option element for each key-value pair
        const option = document.createElement('option');
        option.value = value;
        option.text = key;
        options.push(option);
    }

    // Sort options alphabetically by their text
    options.sort((a, b) => a.text.localeCompare(b.text));

    // Add sorted options to the select element
    options.forEach(option => selectElement.add(option));
}

    // Translate ESM query into filesafe string name
    //  OG exCSV() helper function
    function urlToFilesafeName(csvUrl) {
        // Parse the URL
        const url = new URL(csvUrl, window.location.origin); // Use a dummy base URL if csvUrl is relative
        const searchParams = new URLSearchParams(url.search);

        // Remove 'start' and 'end' parameters if they exist
        if (searchParams.has('start')) {
            searchParams.delete('start');
        }
        if (searchParams.has('end')) {
            searchParams.delete('end');
        }

        // Update the URL's search parameters
        url.search = searchParams.toString();

        // Convert the URL to a string and apply the transformations
        return url.pathname
            .replace(/^\/esm\/v3\//, '') // Remove the leading "/esm/v3/"
            .replace(/&format=csv$/, '') // Remove "&format=csv" if it exists at the end
            .replace(/[?&=]/g, '_') // Replace ?, &, and = with _
            .replace(/,/g, '-') // Replace commas with -
            .replace(/\s+/g, '-') // Replace spaces with -
            .toLowerCase(); // Convert to lowercase for consistency
    }

function sortData(data, column, order) {
    return data.sort((a, b) => {
        // Special handling for PLAY_REQUESTS column which maps to media-tokens
        const valA = column === "PLAY_REQUESTS" ? parseFloat(a["media-tokens"]) || 0 : a[column] ?? "";
        const valB = column === "PLAY_REQUESTS" ? parseFloat(b["media-tokens"]) || 0 : b[column] ?? "";

        if (!isNaN(valA) && !isNaN(valB)) {
            return order === "desc" ? valB - valA : valA - valB;
        }
        return order === "desc" ? valB.toString().localeCompare(valA.toString()) : valA.toString().localeCompare(valB.toString());
    });
}

        if (!acc[groupKey]) acc[groupKey] = { date, event };
        groupByColumns.forEach(col => acc[groupKey][col] = item[col] || "");
        if (!acc[groupKey][requestorId]) acc[groupKey][requestorId] = 0;
        acc[groupKey][requestorId] += count;

//  EXPERIMENTAL COUNT ZONE -------------------------------------------------
//  MOST ESM calls will contain metrics
//  &metrics=authn-attempts,authn-successful,authz-attempts,authz-failed,authz-rejected,authz-successful,media-tokens
//  but some ESM dimensions are only COUNT based
//
//  This helper takes an incoming ESM URL, then lops off the METRICs portion so the ESM query can be called without the "dimensions doesn't exist" errors
function checkForCountCall(url) {
    // Extract the path and query string
    const [path, query] = url.split('?');

    if (url.includes('channel')) 
    {   //  HACK : metrics sanitation

        // Remove authn metrics from the query string
        url = url.replace(/(metrics=)[^&]*/, (match, p1) => {
            const metrics = match.split('=')[1]
                .split(',')
                .filter(metric => !metric.startsWith('authn-'))
                .join(',');
            return `${p1}${metrics}`;
        });
    }

    // Check if the path contains '/event' or '/event/'
    if (!path.includes('/event') && !path.includes('/event/')) {


        // NOTE : some /dc calls do not contain requestor-id, but have media-company instead
        if (url.includes('/dc')) 
        {
                // Check if "/requestor-id/" appears anywhere before "/dc"
                const indexOfDC = url.indexOf('/dc');
                const substringBeforeDC = url.substring(0, indexOfDC);

            if (!substringBeforeDC.includes('/requestor-id/')) {
                url = url.replace(/requestor-id/g, 'media-company');
            }
        }

        return url; // Return the original URL if the path doesn't contain '/event' or '/event/'
    }

    // Split the query string into individual parameters
    const params = query ? query.split('&') : [];

    // Filter out the 'metrics' parameter
    const filteredParams = params.filter(param => !param.startsWith('metrics='));

    // Reconstruct the query string without adding '=' for keys without values
    const sanitizedQuery = filteredParams.join('&');

    // Reconstruct the URL
    return sanitizedQuery ? `${path}?${sanitizedQuery}` : path;
}

    event.preventDefault(); // Prevent the default paste behavior

    // Get the pasted text
    const pastedText = (event.clipboardData || window.clipboardData).getData('text');

    // Check if the pasted text contains "/esm/v3/"
    if (pastedText.includes('/esm/v3/')) {

      // Extract everything after "/esm/v3/"
      const newValue = pastedText.substring(pastedText.indexOf('/esm/v3/'));

ack("GOT ESM V3 URL!!! " + pastedText);
ack("MEG IT >>  " + newValue);
      
      // Set the new value to the text field
      this.value = newValue;
    }
  });
//  PASTE FULL ESM URL ZONE -------------------------------------------------


//  INIT FORM
        //  INIT FORM WITH DEFAULTS
        setupUrl();
        
        //  SETUP DATE FIELDS
        if(fldStart&&fldEnd)
        {
            // DATE CHANGE HANDLERS keep the ESM url updated when date fields change
            fldStart.addEventListener('change', (e) => {
            ack("START DATE CHANGE TO : "+e.target.value);
                dateSink('start', e.target.value);
            });

            fldEnd.addEventListener('change', (e) => {
            ack("END DATE CHANGE TO : "+e.target.value);
                dateSink('end', e.target.value);
            });

            // Set fldStart.value to NOW - 24 hours and fldEnd.value to NOW
            fldStart.value = new Date(Date.now() - 86400000).toISOString().slice(0, 16); // 24 hours ago for START
            fldEnd.value = new Date().toISOString().slice(0, 16); // NOW for END
        }
        else
        {
            ack("?DONDE ES LOS DATE FIELDOS?");
        }
